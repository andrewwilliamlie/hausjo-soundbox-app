# Production stack for beta.hausjo.co.id on the Hostinger VPS (Docker Manager).
# Secrets are NOT in this file: set them as the project's environment variables.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hausjo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hausjo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hausjo"]
      interval: 10s
      retries: 5

  app:
    image: ghcr.io/andrewwilliamlie/hausjo-soundbox-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hausjo:${DB_PASSWORD}@db:5432/hausjo
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-https://beta.hausjo.co.id}
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      OCR_PROVIDER: ${OCR_PROVIDER:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    volumes:
      - uploads:/data/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${APP_DOMAIN:-beta.hausjo.co.id} --to app:3000
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  uploads:
  caddy_data:
